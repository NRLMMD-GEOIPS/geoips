continuous integration:
- title: 'Build the CI image with private plugins using a GitHub token build secret'
  description: |
    Private plugin repositories (``private_plugin_repos`` and
    ``private_fortran_repos`` in ``tests/ansible/inventory/local.yml``) can now be
    cloned while building the Docker image, using a GitHub token that can read
    them.

    * The token is passed as the BuildKit secret ``geoips_private_token``. The new
      ``tests/ansible/scripts/github-token-env.sh`` gives it to git through
      ``GIT_CONFIG_*`` environment variables in the ``geoips-site`` and ``dev``
      install steps only, so it is never stored in an image layer, the image
      history or a cloned repository's ``.git/config``.
    * The install now writes ``/packages/.private_plugins`` listing the private
      plugins, so CI can keep their test output out of public logs.
    * ``pyrocb`` is private, so it moved from ``plugin_repos`` to
      ``private_plugin_repos``. Cloning it without credentials failed the
      ``geoips-site`` build.
    * ``lunarref`` and ``true_color`` are public, so they moved from
      ``private_fortran_repos`` to the end of ``fortran_repos_ordered``: they are
      now installed without the token and their test output is shown in CI logs.
      ``lunarref`` is commented out of ``fortran_repos_ordered`` for now because
      its install fails.
    * The private plugin lists now hold every private plugin repository:
      ``pyrocb``, ``geoips_nucaps``, ``geoips_proxyvis``, ``geoips_tomorrowio``,
      ``geoips_wsfm``, ``geoips_xesmf`` and ``ryglickicane``, and in
      ``private_fortran_repos`` ``geoips_debra``. ``tc_mint`` is removed: there
      is no ``NRLMMD-GEOIPS/tc_mint`` repository, so cloning it failed the
      ``geoips-site`` build.
    * ``integ_test.yaml`` passes the ``GEOIPS_PRIVATE_REPOS_TOKEN`` secret to the
      reusable CI as ``private_repos_token``. Without that secret the image has
      the public plugins only.
  files:
    modified:
    - 'Dockerfile'
    - 'tests/ansible/README.md'
    - 'tests/ansible/inventory/local.yml'
    - 'tests/ansible/roles/source_repos/tasks/main.yml'
    - '.github/workflows/integ_test.yaml'
    added:
    - 'tests/ansible/scripts/github-token-env.sh'
  related-issue:
    number: null
    repo_url: ''
  date:
    start: '10/01/2026'
    finish: '10/01/2026'
