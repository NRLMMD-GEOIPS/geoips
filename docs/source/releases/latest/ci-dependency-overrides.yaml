continuous integration:
- title: 'Replace same-name branch checkouts with explicit dependency overrides'
  description: |
    ``GEOIPS_MODIFIED_BRANCH`` / ``geoips_modified_branch`` are removed: installs
    no longer check out a branch of the same name in every repo that has one,
    falling back to the default branch.

    * The ansible playbook takes ``repo_branches`` (``"repo=ref ..."``, env
      ``REPO_BRANCHES``, Docker build argument ``REPO_BRANCHES``): the branch, tag
      or commit to clone each listed repo at. It checks the list first (unknown
      repos fail, and so do private repos when the ``site`` tasks run without
      ``geoips_use_private_plugins``; other tiers, such as the ``geoips-full``
      image stage, ignore private repos in the list), a ref
      that does not exist fails the install, and so does any other clone error,
      which was ignored before. The refs and commits are written to
      ``$GEOIPS_PACKAGES_DIR/.ci_repo_branches``. ``repo=owner:ref`` clones the
      ref from ``owner``'s fork of the repo (next to ``geoips_repo_url``), for
      branches that only exist in a fork. A repo at a requested ref that a later
      install replaced (a plugin that depends on it by git URL, as geoips_nucaps
      does on pyrocb) is reinstalled from its clone, without dependencies.
    * The ``geoips-site`` target takes ``PIP_OVERRIDES``: pip requirements
      installed last, so they replace the pinned versions, recorded in
      ``$GEOIPS_PACKAGES_DIR/.ci_pip_overrides``. The ``python_env`` install
      tasks leave those packages out of ``requirements.txt``, so the install
      checks of the integration tests no longer put the pinned versions back.
    * geoips_ci sets both from the entry for the branch under test in
      ``.github/ci-dependencies.yaml`` (keyed by branch name, so it does not affect
      ``main`` once merged), or from the new ``dependency_overrides`` input of
      ``integ_test.yaml``.
    * ``check_system_requirements.sh`` no longer switches branches after cloning.
      This is a breaking change for installs outside Docker that set
      ``GEOIPS_MODIFIED_BRANCH``: check out the branches you need yourself.
    * The ``dev`` image stage re-runs the ``site`` install, so it also takes
      ``REPO_BRANCHES``, ``DISABLED_REPOS`` and ``PIP_OVERRIDES``.
  files:
    added:
    - 'docs/source/releases/latest/ci-dependency-overrides.yaml'
    modified:
    - '.github/workflows/integ_test.yaml'
    - 'Dockerfile'
    - 'docs/source/architecture/ci-infrastructure.rst'
    - 'docs/source/getting-started/installing/docker.rst'
    - 'setup/check_system_requirements.sh'
    - 'tests/ansible/README.md'
    - 'tests/ansible/inventory/local.yml'
    - 'tests/ansible/playbooks/install.yml'
    - 'tests/ansible/roles/python_env/tasks/main.yml'
    - 'tests/ansible/roles/settings_repos/tasks/main.yml'
    - 'tests/ansible/roles/source_repos/tasks/main.yml'
    - 'tests/integration_tests/full_install.sh'
    - 'tests/integration_tests/site_install.sh'
  related-issue:
    number: null
    repo_url: 'https://github.com/NRLMMD-GEOIPS/geoips'
  date:
    start: 2026-10-05
    finish: 2026-10-20
