enhancement:
- title: 'Add geoips run spm_rt command'
  description: |
    Adds a new GeoIPS CLI command for the newly implemented spm_rt processing workflow.
    Called via 'geoips run spm_rt'. This procflow implements entirely different logic
    than is required via the order_based procflow and should only be used alongside the
    geoips_spm plugin package.

    Additionally, added new family for procflows to handle the corner case that
    spm_rt represents. The new family is called 'spm_rt'.
