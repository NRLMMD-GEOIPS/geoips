enhancement:
- title: >
    Preliminary deprecation spec, with re-implementation of existing deprecations
    according to it
  description: >
    Adds an initial partial draft of the deprecation specification, defining at least
    two of the three components for implementing a deprecation according to the new,
    standardized pattern: the YAML-formatted message string and the code by which the
    deprecations are implemented for any variety of deprecated "thing." Existing
    deprecations in the GeoIPS codebase are modified according to it. The final base
    component (the canonical reference issue) as well as handling the deprecations in
    the docs and finalizing the full deprecation spec are left to a follow-up PR.
