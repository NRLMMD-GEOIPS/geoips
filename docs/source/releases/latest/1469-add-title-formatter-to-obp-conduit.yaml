bug fix:
- title: 'Add Title Formatter to OBP Conduit'
  description: |
    If you added a title_formatter step to an order-based procflow workflow, the
    step would run and then its output would get thrown away. The output_formatter
    never knew about it, so it built its own title using default arguments instead.

    This connects the title_formatter step to the output_formatter. The formatted
    title now gets passed along as `preformatted_title_str`, and the imagery
    output_formatters use that string instead of making their own.

    All output_formatters in the `image_overlay` family now need to accept a
    `preformatted_title_str` argument. The four in GeoIPS have been updated, but
    any outside of GeoIPS will need the same argument added.
  files:
    deleted:
    - ''
    moved:
    - ''
    added:
