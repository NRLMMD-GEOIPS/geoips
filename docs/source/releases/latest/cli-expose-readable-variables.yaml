enhancement:
- title: 'Expose variables able to be read by a reader plugin'
  description: |
    Adds new functionality to expose what channels a given reader plugin can actually
    read. This information is then attached to the output of the
    'geoips describe reader' command. Additionally, you can access this information via
    <reader_plugin>.readable_channels attribute.

    Adds a new class called 'ChannelInformation' which is used to construct a unified
    channel information dictionary for any reader. These dictionaries are validated via
    pydantic to ensure that the input data adheres to the information model.
  files:
    modified:
      - geoips/commandline/geoips_command.py
      - geoips/commandline/geoips_describe.py
      - geoips/interfaces/class_based/readers.py
