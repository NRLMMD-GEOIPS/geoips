# roles/settings_repos/tasks/main.yml
---
- name: "Clone settings repo"
  # Default branch, or the ref given in repo_branches (see source_repos).
  ansible.builtin.git:
    repo: "{{ geoips_repo_url }}/{{ item }}.git"
    dest: "{{ geoips_packages_dir }}/{{ item }}"
    version: "{{ (repo_branch_map | default({}))[item] | default(omit) }}"
  loop: "{{ settings_repos }}"
  tags: [full, site]
