# roles/source_repos/tasks/main.yml
#
# Installs plugin source repos via clone + pip install.
# Fortran repos have an explicit ordering constraint.
#
# Repos are cloned on their default branch, or on the branch, tag or commit given
# for them in repo_branches, from a fork if it names one (see the playbook's
# pre_tasks: repo_branch_map holds the refs, repo_url_map the fork URLs). A clone
# that fails, including a requested ref that does not exist, fails the install.
#
# Tasks are inlined (no include_tasks) to avoid tag inheritance issues with
# ansible-core when --tags site is used.
#
---
# ---- Standard plugin repos (alphabetical order is fine) ----
- name: "Clone standard plugin repos"
  ansible.builtin.git:
    repo: "{{ (repo_url_map | default({}))[repo_name] | default(geoips_repo_url ~ '/' ~ repo_name ~ '.git') }}"
    dest: "{{ geoips_packages_dir }}/{{ repo_name }}"
    version: "{{ (repo_branch_map | default({}))[repo_name] | default(omit) }}"
  loop: "{{ plugin_repos }}"
  loop_control:
    loop_var: repo_name
  tags: [site]

- name: "Pip install standard plugin repos"
  ansible.builtin.pip:
    name: "{{ geoips_packages_dir }}/{{ repo_name }}"
    editable: "{{ editable_pip_install | bool }}"
    extra_args: "{{ pip_extra_args }}"
    state: present
  loop: "{{ plugin_repos }}"
  loop_control:
    loop_var: repo_name
  tags: [site]

