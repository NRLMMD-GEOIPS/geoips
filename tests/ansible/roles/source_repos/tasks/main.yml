# ---- Fortran chain (ORDER MATTERS) ----
- name: "Clone fortran repos"
  ansible.builtin.git:
    repo: "{{ geoips_repo_url }}/{{ repo_name }}.git"
    dest: "{{ geoips_packages_dir }}/{{ repo_name }}"
    version: "{{ (repo_branch_map | default({}))[repo_name] | default(omit) }}"
  loop: "{{ fortran_repos_ordered }}"
  loop_control:
    loop_var: repo_name
  tags: [site]

- name: "Clean fortran plugin repos"
  ansible.builtin.command:
    cmd: make clean
    chdir: "{{ geoips_packages_dir }}/{{ repo_name }}"
  loop: "{{ fortran_repos_ordered }}"
  loop_control:
    loop_var: repo_name
  failed_when: false
  changed_when: false
  tags: [site]


- name: "Pip install fortran repos"
  ansible.builtin.pip:
    name: "{{ geoips_packages_dir }}/{{ repo_name }}"
    editable: "{{ editable_pip_install | bool }}"
    extra_args: "{{ pip_extra_args }}"
    state: present
  loop: "{{ fortran_repos_ordered }}"
  loop_control:
    loop_var: repo_name
  tags: [site]

# ---- Private repos (when enabled) ----
- name: "Clone private plugin repos"
  ansible.builtin.git:
    repo: "{{ geoips_repo_url }}/{{ repo_name }}.git"
    dest: "{{ geoips_packages_dir }}/{{ repo_name }}"
    version: "{{ (repo_branch_map | default({}))[repo_name] | default(omit) }}"
  loop: "{{ private_plugin_repos }}"
  loop_control:
    loop_var: repo_name
  when: geoips_use_private_plugins | bool
  tags: [site]

- name: "Pip install private plugin repos"
  ansible.builtin.pip:
    name: "{{ geoips_packages_dir }}/{{ repo_name }}"
    editable: "{{ editable_pip_install | bool }}"
    extra_args: "{{ pip_extra_args }}"
    state: present
  loop: "{{ private_plugin_repos }}"
  loop_control:
    loop_var: repo_name
  when: geoips_use_private_plugins | bool
  tags: [site]

# ---- Private fortran repos (ORDER MATTERS, after fortran chain) ----
- name: "Clone private fortran repos"
  ansible.builtin.git:
    repo: "{{ geoips_repo_url }}/{{ repo_name }}.git"
    dest: "{{ geoips_packages_dir }}/{{ repo_name }}"
    version: "{{ (repo_branch_map | default({}))[repo_name] | default(omit) }}"
  loop: "{{ private_fortran_repos }}"
  loop_control:
    loop_var: repo_name
  when: geoips_use_private_plugins | bool
  tags: [site]

- name: "Pip install private fortran repos"
  ansible.builtin.pip:
    name: "{{ geoips_packages_dir }}/{{ repo_name }}"
    editable: "{{ editable_pip_install | bool }}"
    extra_args: "{{ pip_extra_args }}"
    state: present
  loop: "{{ private_fortran_repos }}"
  loop_control:
    loop_var: repo_name
  when: geoips_use_private_plugins | bool
  tags: [site]

- name: "Record the installed private plugin repos"
  # reusable-ci (geoips_ci) reads this list to keep these plugins' test output out
  # of the logs of public repositories.
  ansible.builtin.copy:
    dest: "{{ geoips_packages_dir }}/.private_plugins"
    content: "{{ ((private_plugin_repos + private_fortran_repos) | join('\n')) + '\n' }}"
    mode: "0644"
  when: geoips_use_private_plugins | bool
  tags: [site]

# ---- Extra plugins passed via build arg / CLI ----
- name: "Parse extra_plugin_packages into a list"
  ansible.builtin.set_fact:
    extra_plugins_list: "{{ extra_plugin_packages.split(',') | map('trim') | select | list }}"
  when: extra_plugin_packages | length > 0
  tags: [base, full, site]

- name: "Clone extra plugin repos"
  ansible.builtin.git:
    repo: "{{ geoips_repo_url }}/{{ repo_name }}.git"
    dest: "{{ geoips_packages_dir }}/{{ repo_name }}"
    version: "{{ (repo_branch_map | default({}))[repo_name] | default(omit) }}"
  loop: "{{ extra_plugins_list | default([]) }}"
  loop_control:
    loop_var: repo_name
  when: extra_plugins_list is defined and extra_plugins_list | length > 0
  tags: [base, full, site]

- name: "Pip install extra plugin repos"
  ansible.builtin.pip:
    name: "{{ geoips_packages_dir }}/{{ repo_name }}"
    editable: "{{ editable_pip_install | bool }}"
    extra_args: "{{ pip_extra_args }}"
    state: present
  loop: "{{ extra_plugins_list | default([]) }}"
  loop_control:
    loop_var: repo_name
  when: extra_plugins_list is defined and extra_plugins_list | length > 0
  tags: [base, full, site]

# ---- Repos checked out at a requested ref (repo_branches) ----
- name: "Find the commits of the repos checked out at a requested ref"
  ansible.builtin.command:
    cmd: git -C "{{ geoips_packages_dir }}/{{ item.key }}" rev-parse HEAD
  loop: "{{ (repo_branch_map | default({})) | dict2items }}"
  register: _requested_refs
  changed_when: false
  tags: [site]

- name: "Record the repos checked out at a requested ref"
  # reusable-ci (geoips_ci) shows this in the job summary, and fails if a requested
  # ref is missing from it.
  ansible.builtin.copy:
    dest: "{{ geoips_packages_dir }}/.ci_repo_branches"
    content: |
      {% for r in _requested_refs.results %}
      {{ r.item.key }} {{ r.item.value }} {{ r.stdout }}
      {% endfor %}
    mode: "0644"
  when: (repo_branch_map | default({})) | length > 0
  tags: [site]
