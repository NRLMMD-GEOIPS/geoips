# tests/ansible/playbooks/install.yml
#
# Usage examples:
#   ansible-playbook playbooks/install.yml --tags base
#   ansible-playbook playbooks/install.yml --tags base,full
#   ansible-playbook playbooks/install.yml --tags base,full,site
#   ansible-playbook playbooks/install.yml --tags base,full,site -e geoips_use_private_plugins=true
#   ansible-playbook playbooks/install.yml --tags base,full,site -e extra_plugin_packages=my_plugin,other_plugin
#   ansible-playbook playbooks/install.yml --tags base,full,site -e "repo_branches='recenter_tc=my-fix geocolor=v1.2.0'"
#   ansible-playbook playbooks/install.yml --tags base,full,site -e "repo_branches='rayleigh=someone:their-fix'"
#   ansible-playbook playbooks/install.yml --tags base,full,site -e "disabled_repos='synth_green lunarref'"
#
# From a Dockerfile:
#   RUN ansible-playbook /ansible/playbooks/install.yml --tags base,full,site
#
---
- name: Install GeoIPS
  hosts: localhost
  gather_facts: false

  pre_tasks:
    # repo_branches: "repo=ref repo=ref ...", the branch, tag or commit to clone each
    # listed repo at (the other repos use their default branch).  "repo=owner:ref"
    # clones the ref from owner's fork of the repo (same repo name, next to
    # geoips_repo_url, e.g. https://github.com/owner/repo.git).
    - name: Check the format of repo_branches
      ansible.builtin.assert:
        that: malformed | length == 0
        fail_msg: "repo_branches entries must be repo=ref or repo=owner:ref: {{ malformed | join(', ') }}"
        quiet: true
      vars:
        malformed: "{{ repo_branches.split() | reject('match', '^[^=:]+=([A-Za-z0-9-]+:)?[^=:]+$') | list }}"
      tags: [always]

    - name: Parse repo_branches
      ansible.builtin.set_fact:
        # repo -> ref (without the fork owner)
        repo_branch_map: >-
          {% set m = {} %}{% for repo, ref in _entries %}{% set _ = m.update({repo: ref.split(':')[-1]}) %}{% endfor %}{{ m }}
        # repo -> URL to clone, for the repos cloned from a fork
        repo_url_map: >-
          {% set m = {} %}{% for repo, ref in _entries if ':' in ref %}{% set _ = m.update({repo: _fork_url_base ~ ref.split(':')[0] ~ '/' ~ repo ~ '.git'}) %}{% endfor %}{{ m }}
      vars:
        _entries: "{{ repo_branches.split() | map('split', '=', 1) | list }}"
        # geoips_repo_url without the organization
        _fork_url_base: "{{ geoips_repo_url | regex_replace('/*$', '') | regex_replace('[^/]+$', '') }}"
      tags: [always]

    - name: Check the repos in repo_branches
      ansible.builtin.assert:
        that:
          - unknown | length == 0
          - private_off | length == 0
        fail_msg: >-
          repo_branches:
          {{ ('repos this playbook does not clone: ' ~ (unknown | join(', ')) ~ '.') if unknown else '' }}
          {{ ('private repos, but geoips_use_private_plugins is false: ' ~ (private_off | join(', ')) ~ '.') if private_off else '' }}
        quiet: true
      vars:
        private_repos: "{{ private_plugin_repos + private_fortran_repos }}"
        known: "{{ settings_repos + plugin_repos + fortran_repos_ordered + private_repos + (extra_plugin_packages.split(',') | map('trim') | select | list) }}"
        unknown: "{{ repo_branch_map.keys() | difference(known) }}"
        # Private repos are only cloned by the site tasks; other tiers (the
        # geoips-full image stage) get the same repo_branches and ignore them.
        installs_private: "{{ ansible_run_tags | intersect(['site', 'all']) | length > 0 }}"
        private_off: "{{ (repo_branch_map.keys() | intersect(private_repos)) if (installs_private | bool and not (geoips_use_private_plugins | bool)) else [] }}"
      tags: [always]

    # disabled_repos: "repo repo ...", plugin repos to leave out of the install.
    - name: Check the repos in disabled_repos
      ansible.builtin.assert:
        that:
          - unknown | length == 0
          - overridden | length == 0
        fail_msg: >-
          disabled_repos:
          {{ ('not plugin repos this playbook installs: ' ~ (unknown | join(', ')) ~ '.') if unknown else '' }}
          {{ ('also in repo_branches: ' ~ (overridden | join(', ')) ~ '.') if overridden else '' }}
        quiet: true
      vars:
        plugin_lists: "{{ plugin_repos + fortran_repos_ordered + private_plugin_repos + private_fortran_repos }}"
        unknown: "{{ disabled_repos.split() | difference(plugin_lists) }}"
        overridden: "{{ disabled_repos.split() | intersect(repo_branch_map.keys()) }}"
      tags: [always]

    # reject keeps the order, which matters for the fortran repos.
    - name: Leave the disabled repos out of the plugin repo lists
      ansible.builtin.set_fact:
        plugin_repos: "{{ plugin_repos | reject('in', disabled) | list }}"
        fortran_repos_ordered: "{{ fortran_repos_ordered | reject('in', disabled) | list }}"
        private_plugin_repos: "{{ private_plugin_repos | reject('in', disabled) | list }}"
        private_fortran_repos: "{{ private_fortran_repos | reject('in', disabled) | list }}"
      vars:
        disabled: "{{ disabled_repos.split() }}"
      when: disabled_repos.split() | length > 0
      tags: [always]

  roles:
    - role: system_deps
    - role: python_env
    - role: cartopy_shapefiles
    - role: settings_repos
    - role: source_repos
    - role: registries
