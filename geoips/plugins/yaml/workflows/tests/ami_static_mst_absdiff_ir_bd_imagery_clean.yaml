# script migration = done
# product testing = done

# Default values - if you do not have this exact test case available, call with available data files / sectors.
# This exact test case required for valid comparisons - remove "compare_path" argument if running a different
# set of arguments.

apiVersion: geoips/v1
interface: workflows
family: order_based
name: ami_static_mst_absdiff_ir_bd_imagery_clean
docstring: |
  AMI absdiff-IR-BD multi-scan-time absolute difference clean imagery over the static
  GEO-KOMPSAT sector.
package: geoips
test:
  fnames: !ENV ${GEOIPS_TESTDATA_DIR}/test_data_multi_scan_times/data/geokompsat-ami/LA/*ir112*.nc
  outputs:
    output_formatter:
      full_test_policy: on_token_mismatch # always | never
      compare_path: !ENV ${GEOIPS_PACKAGES_DIR}/geoips/tests/outputs/ami.static.mst.absdiff-IR-BD.imagery_clean
      output_checker_name: image
arguments:
  globals:
    product_name: absdiff-IR-BD
    reader_defined_area_def: False
    # will be uncommented after split operation is implemented
    # sector_list: ["geokompsat"]
    minimum_coverage: 0
spec:
  steps:
    sector:
      kind: sector
      name: geokompsat
    reader:
      kind: reader
      name: ami_netcdf
      depends_on: []
    algorithm:
      kind: algorithm
      name: absdiff_mst
      arguments:
        variables: [IR112BT, IR112BT]
        output_data_range: [0.0, 35.0]
        input_units: Kelvin
        output_units: celsius
        min_outbounds: crop
        max_outbounds: crop
        norm: False
        inverse: False
    colormapper:
      kind: colormapper
      name: matplotlib_linear_norm
      arguments:
        cmap_name: turbo
        cmap_source: matplotlib
        data_range: [0.0, 35.0]
        cbar_ticks: [0, 5, 10, 15, 20, 25, 30, 35]
        cbar_label: 11µ BT (°C)
    interpolator:
      kind: interpolator
      name: interp_nearest
      depends_on: [sector, algorithm]
    coverage_checker:
      kind: coverage_checker
      name: masked_arrays
      arguments:
        minimum_coverage: 10
    filename_formatter:
      kind: filename_formatter
      name: geoips_fname
      depends_on: [interpolator, sector, coverage_checker]
    output_formatter:
      kind: output_formatter
      name: imagery_clean
      depends_on:
        - sector
        - colormapper
        - algorithm
        - filename_formatter
