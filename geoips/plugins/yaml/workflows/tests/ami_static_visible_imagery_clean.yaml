# script migration = done
# product testing = done

# Default values - if you do not have this exact test case available, call with available data files / sectors.
# This exact test case required for valid comparisons - remove "compare_path" argument if running a different
# set of arguments.

apiVersion: geoips/v1
interface: workflows
family: order_based
name: ami_static_visible_imagery_clean
docstring: |
  AMI Visible clean imagery over the static GEO-KOMPSAT sector using daytime data.
package: geoips
test:
  fnames: !ENV ${GEOIPS_TESTDATA_DIR}/test_data_ami/data/20231208_0300_daytime/*.nc
  outputs:
    output_formatter:
      full_test_policy: on_token_mismatch # always | never
      compare_path: !ENV ${GEOIPS_PACKAGES_DIR}/geoips/tests/outputs/ami.static.Visible.imagery_clean
      output_checker_name: image
arguments:
  globals:
    product_name: Visible
    reader_defined_area_def: False
    # will be uncommented after split operation is implemented
    # sector_list: ["geokompsat"]
spec:
  steps:
    sector:
      kind: sector
      name: geokompsat
    reader:
      kind: reader
      name: ami_netcdf
      depends_on: [sector]
      arguments:
        resampled_read: True
        chans: ["VI006Ref"]
    ami_Visible:
      kind: product
      name: [ami, Visible]
      depends_on: [sector, reader]
      arguments:
        coverage_checker.variable_name: Visible
    filename_formatter:
      kind: filename_formatter
      name: geoips_fname
      depends_on: [ami_Visible.algorithm, sector, ami_Visible.coverage_checker]
    output_formatter:
      kind: output_formatter
      name: imagery_clean
      depends_on:
        - ami_Visible.algorithm
        - ami_Visible.colormapper
        - filename_formatter
        - sector
