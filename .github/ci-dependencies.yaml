# Test-only dependency overrides, keyed by branch: only the entry of the branch under
# test applies (see "Testing against other branches or versions" in the geoips_ci README).
#
# TODO before merging #1510: remove this entry once the PRs below are merged.
biosafetylvl5-better-errors-from-docker-apt:
  python:
    # Atomic registry writes (fixes JSONDecodeError races under pytest-xdist).
    # NRLMMD-GEOIPS/pluginify#37
    - "pluginify @ git+https://github.com/NRLMMD-GEOIPS/pluginify@atomic-writes"
  repos:
    # Commit the missing <repo>/_version.py (import failed without it).
    # NRLMMD-GEOIPS/lunarref#8, NRLMMD-GEOIPS/true_color#7
    lunarref: add-version-file
    true_color: add-version-file
    # Fix imports of geoips plugin modules that moved to geoips.plugins.classes.
    # NRLMMD-GEOIPS/ryglickicane#11, NRLMMD-GEOIPS/recenter_tc#62
    ryglickicane: fix-geoips-plugin-imports
    recenter_tc: fix-geoips-plugin-imports
    # Fix output formatter argument order to allow import of pyrocb.
    # NRLMMD-GEOIPS/pyrocb#12
    pyrocb: fix-ci-errors
    # Fix output formatter argument order, move introduction docs to getting-started.
    # NRLMMD-GEOIPS/geoips_plugin_example#22
    geoips_plugin_example: fix-output-formatter-arg-order
    # Remove the stray userguide/index.rst that broke the docs build.
    # NRLMMD-GEOIPS/geoips_tomorrowio#4
    geoips_tomorrowio: remove-stray-userguide
    # Lint fixes, from jthielen's forks (owner:ref).
    # NRLMMD-GEOIPS/fortran_utils#5, NRLMMD-GEOIPS/rayleigh#9
    fortran_utils: "jthielen:fix-lint-xref-geoips-1510"
    rayleigh: "jthielen:fix-lint-xref-geoips-1510"
