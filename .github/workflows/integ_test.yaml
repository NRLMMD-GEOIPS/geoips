name: Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: integ-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  integ-test-editable:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.draft == false
    name: integ-test (editable=true)
    uses: NRLMMD-GEOIPS/geoips_ci/.github/workflows/reusable-ci.yaml@run-all-the-tests
    with:
      pip_editable: true
      continue_on_plugins_integ_error: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}
      # Read-only token for the private plugin repos (see geoips_ci README,
      # "Private plugin repositories"). Without it the image has public plugins only.
      private_repos_token: ${{ secrets.GEOIPS_PRIVATE_REPOS_TOKEN }}

